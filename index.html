<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- lab：検索に出さない（robots.txt ではブロックしない）・GA なし（site.js の LAB）-->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<title>Lab — Sano Ryota Works Archives</title>
<link rel="icon" href="/media/site/favicon.png">
<link rel="stylesheet" href="assets/site.css?v=lab1">
<script src="assets/site.js?v=lab1"></script>
<style>
  /* ===== 開口部の大きさ（ここを変えると調整できる）===== */
  :root{--aperture-w:44vw;--aperture-h:52vh;}
  @media (max-width:760px){:root{--aperture-w:78vw;--aperture-h:42vh;}}
  #aperture{position:fixed;left:0;top:0;width:var(--aperture-w);height:var(--aperture-h);visibility:hidden;pointer-events:none;}

  #glass{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:pan-y;}
  #spacer{position:relative;pointer-events:none;}
  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:30px;z-index:60;pointer-events:none;mix-blend-mode:difference;color:#fff;}
  header .center{position:absolute;left:50%;top:30px;transform:translateX(-50%);pointer-events:auto;}
  header .right{margin-left:auto;pointer-events:auto;display:inline-flex;align-items:center;}
  .favico{width:var(--fs);height:var(--fs);object-fit:contain;margin-right:7px;animation:blink 1s steps(1,end) infinite;mix-blend-mode:normal;}
  @keyframes blink{50%{opacity:0;}}
  .botmsg{position:relative;z-index:10;padding:24px 30px 30px;pointer-events:none;}
  /* キーボード用のリンク（見た目は3Dの枠で示す。読み上げにも使う）*/
  #links a{position:fixed;left:-9999px;top:0;}
  @media (max-width:760px){header{padding:16px 18px;}header .center{position:static;transform:none;max-width:58%;}.botmsg{padding:16px 18px 26px;}}
  @media (prefers-reduced-motion:reduce){.favico{animation:none;}}
</style>
</head>
<body>
<canvas id="glass" aria-hidden="true"></canvas>
<div id="aperture"></div>
<header>
  <a class="center" id="hTitle" data-home href="./"></a>
  <a class="right" href="profile.html"><img class="favico" src="/media/site/favicon.png" alt=""><span id="hProfile"></span></a>
</header>
<nav id="links" aria-label="Works"></nav>
<div id="spacer"></div>
<footer class="botmsg" id="botmsg" hidden><span></span></footer>
<script type="module" src="assets/glass.js?v=lab1"></script>
</body>
</html>
